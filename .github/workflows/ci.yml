name: Worldbuster CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l backend)"
          if [ -n "$files" ]; then
            echo "Unformatted Go files:"
            printf "%s\n" "$files"
            exit 1
          fi
      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4
      - name: Go test
        run: go test ./...
      - name: Go race test
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Go build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Typecheck and production build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Android build
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worldbuster-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: worldbuster
          POSTGRES_USER: worldbuster
          POSTGRES_PASSWORD: worldbuster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldbuster -d worldbuster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Verify Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build server
        run: go build -o /tmp/worldbuster ./backend/cmd/worldbuster
      - name: Fresh database migration and API smoke test
        env:
          WORLDBUSTER_DATABASE_URL: postgres://worldbuster:worldbuster@localhost:5432/worldbuster?sslmode=disable
          WORLDBUSTER_MIGRATIONS_DIR: database/migrations
        run: |
          go test ./backend/internal/store -run TestApplyMigrationsFreshPostgres -count=1
          /tmp/worldbuster >/tmp/worldbuster.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/auth/register -H 'Content-Type: application/json' -d "{\"username\":\"ci_player_${GITHUB_RUN_ID}\",\"password\":\"correct-horse-battery-staple\"}"
          curl -fsS -D /tmp/login.headers -c /tmp/wb.cookies -X POST http://127.0.0.1:8080/api/v1/auth/login -H 'Content-Type: application/json' -d "{\"username\":\"ci_player_${GITHUB_RUN_ID}\",\"password\":\"correct-horse-battery-staple\"}"
          cat /tmp/login.headers
          cat /tmp/wb.cookies
          curl -fsS -b /tmp/wb.cookies http://127.0.0.1:8080/api/v1/player/state
          curl -fsS -b /tmp/wb.cookies http://127.0.0.1:8080/api/v1/player/dashboard
          curl -fsS -b /tmp/wb.cookies http://127.0.0.1:8080/api/v1/notifications
          kill $PID
          /tmp/worldbuster >/tmp/worldbuster-restart.log 2>&1 &
          PID2=$!
          trap 'kill $PID2 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
          curl -fsS -b /tmp/wb.cookies http://127.0.0.1:8080/api/v1/player/state
          curl -fsS -b /tmp/wb.cookies http://127.0.0.1:8080/api/v1/player/dashboard
          echo "migration restart smoke passed"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose build and startup smoke test
        run: |
          docker compose -f infrastructure/docker-compose.yml up -d --build
          trap 'docker compose -f infrastructure/docker-compose.yml down -v' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8080/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/auth/register -H 'Content-Type: application/json' -d "{\"username\":\"docker_ci_${GITHUB_RUN_ID}\",\"password\":\"correct-horse-battery-staple\"}"
          curl -fsS -c /tmp/docker-wb.cookies -X POST http://127.0.0.1:8080/api/v1/auth/login -H 'Content-Type: application/json' -d "{\"username\":\"docker_ci_${GITHUB_RUN_ID}\",\"password\":\"correct-horse-battery-staple\"}"
          curl -fsS -b /tmp/docker-wb.cookies http://127.0.0.1:8080/api/v1/player/state
          curl -fsS -b /tmp/docker-wb.cookies http://127.0.0.1:8080/api/v1/player/dashboard
          curl -fsS -b /tmp/docker-wb.cookies http://127.0.0.1:8080/api/v1/notifications
